name: Android APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App display name"
        required: true
        default: "MyApp"
      package_name:
        description: "Package name (reverse-DNS)"
        required: true
        default: "com.example.myapp"
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]
      zip_artifact_id:
        description: "Run ID of uploaded zip (leave empty for scaffold mode)"
        required: false
        default: ""
      language:
        description: "Language (scaffold mode only)"
        required: false
        default: "kotlin"
        type: choice
        options: [kotlin, java]
      min_sdk:
        description: "Minimum SDK version (scaffold mode only)"
        required: false
        default: "21"
      target_sdk:
        description: "Target SDK version (scaffold mode only)"
        required: false
        default: "34"
      compile_sdk:
        description: "Compile SDK version (scaffold mode only)"
        required: false
        default: "34"
      minify:
        description: "Enable ProGuard/R8 minification for release builds (scaffold mode only)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      icon_base64:
        description: "Base64-encoded PNG app icon (optional, scaffold mode only)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout repo (contains scaffold scripts) ──────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up JDK 17 ──────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Set up Android SDK ─────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME >/dev/null 2>&1 || true
          sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-30" "platforms;android-31" "platforms;android-32" \
            "platforms;android-33" "platforms;android-34" "platforms;android-35" \
            "build-tools;30.0.3" "build-tools;33.0.2" "build-tools;34.0.0" "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # ── 4. Download uploaded zip OR scaffold fresh project ────────────
      - name: Prepare project
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PKG: ${{ github.event.inputs.package_name }}
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
          ZIP_URL: ${{ github.event.inputs.zip_artifact_id }}
          LANGUAGE: ${{ github.event.inputs.language }}
          MIN_SDK: ${{ github.event.inputs.min_sdk }}
          TARGET_SDK: ${{ github.event.inputs.target_sdk }}
          COMPILE_SDK: ${{ github.event.inputs.compile_sdk }}
          MINIFY: ${{ github.event.inputs.minify }}
          ICON_B64: ${{ github.event.inputs.icon_base64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/android_project
          if [ -n "$ZIP_URL" ]; then
            echo "📦 Downloading uploaded project zip..."
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/octet-stream" \
              "$ZIP_URL" --output /tmp/project.zip
            unzip -q /tmp/project.zip -d /tmp/android_project
            # If extracted into a single sub-folder, hoist it
            INNER=$(ls /tmp/android_project | head -1)
            if [ "$(ls /tmp/android_project | wc -l)" = "1" ] && \
               [ -d "/tmp/android_project/$INNER" ]; then
              mv /tmp/android_project/$INNER /tmp/android_project_real
              mv /tmp/android_project_real /tmp/android_project
            fi
          else
            echo "🏗️  Scaffolding fresh Android project..."
            ICON_ARGS=()
            if [ -n "$ICON_B64" ]; then
              echo "$ICON_B64" | base64 -d > /tmp/icon.png
              ICON_ARGS=(--icon /tmp/icon.png)
            fi
            python3 builder/scaffold.py \
              --app-name "$APP_NAME" \
              --package "$PKG" \
              --out /tmp/android_project \
              --language "$LANGUAGE" \
              --min-sdk "$MIN_SDK" \
              --target-sdk "$TARGET_SDK" \
              --compile-sdk "$COMPILE_SDK" \
              --minify "$MINIFY" \
              "${ICON_ARGS[@]}"
          fi

      # ── 5. Validate project structure ─────────────────────────────────
      - name: Validate structure
        run: |
          echo "=== Project tree ==="
          find /tmp/android_project -not -path "*/build/*" -not -path "*/.gradle/*" | head -80
          if [ ! -f /tmp/android_project/settings.gradle ] && \
             [ ! -f /tmp/android_project/settings.gradle.kts ]; then
            echo "❌ No settings.gradle found — not a valid Android project"
            exit 1
          fi
          if [ ! -f /tmp/android_project/app/build.gradle ] && \
             [ ! -f /tmp/android_project/app/build.gradle.kts ]; then
            echo "❌ No app/build.gradle found"
            exit 1
          fi
          echo "✅ Structure valid"

      # ── 6. Write local.properties ─────────────────────────────────────
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > /tmp/android_project/local.properties
          echo "✅ local.properties written"

      # ── 7. Gradle build ───────────────────────────────────────────────
      - name: Build APK
        working-directory: /tmp/android_project
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx3g -XX:MaxMetaspaceSize=512m"
        run: |
          chmod +x gradlew 2>/dev/null || true
          TASK="assembleDebug"
          if [ "$BUILD_TYPE" = "release" ]; then TASK="assembleRelease"; fi
          GRADLE_CMD="./gradlew"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then GRADLE_CMD="gradle"; fi
          echo "⚡ Running: $GRADLE_CMD $TASK"
          "$GRADLE_CMD" "$TASK" \
            --no-daemon \
            --stacktrace \
            --build-cache \
            2>&1 | tee /tmp/gradle_output.txt
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo "❌ Gradle build failed (exit $EXIT)"
            echo "=== Last 60 lines ==="
            tail -60 /tmp/gradle_output.txt
            exit $EXIT
          fi
          echo "✅ Gradle build succeeded"

      # ── 8. Locate APK ─────────────────────────────────────────────────
      - name: Locate APK
        id: locate_apk
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          PKG: ${{ github.event.inputs.package_name }}
        run: |
          APK=$(find /tmp/android_project/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No APK found after build"
            exit 1
          fi
          SAFE_NAME=$(echo "$APP_NAME" | tr ' ' '_' | tr -cd 'a-zA-Z0-9_-')
          DEST="/tmp/${SAFE_NAME}-${BUILD_TYPE}.apk"
          cp "$APK" "$DEST"
          SIZE=$(du -sh "$DEST" | cut -f1)
          SHA=$(sha256sum "$DEST" | cut -d' ' -f1)
          echo "apk_path=$DEST" >> $GITHUB_OUTPUT
          echo "apk_name=${SAFE_NAME}-${BUILD_TYPE}.apk" >> $GITHUB_OUTPUT
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT
          echo "apk_sha256=$SHA" >> $GITHUB_OUTPUT
          echo "✅ APK: $DEST ($SIZE) — SHA256: $SHA"

      # ── 9. Sign release APK (optional — needs KEYSTORE_* repo secrets) ─
      - name: Sign release APK
        if: ${{ github.event.inputs.build_type == 'release' && secrets.KEYSTORE_BASE64 != '' }}
        env:
          APK_PATH: ${{ steps.locate_apk.outputs.apk_path }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          KEYSTORE=/tmp/release.keystore
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

          ALIGNED="${APK_PATH%.apk}-aligned.apk"
          SIGNED="${APK_PATH%.apk}-signed.apk"

          "$ZIPALIGN" -f -p 4 "$APK_PATH" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          rm -f "$KEYSTORE" "$ALIGNED"
          mv "$SIGNED" "$APK_PATH"

          NEW_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          NEW_SHA=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "apk_size=$NEW_SIZE" >> $GITHUB_OUTPUT
          echo "apk_sha256=$NEW_SHA" >> $GITHUB_OUTPUT
          echo "apk_signed=true" >> $GITHUB_OUTPUT
          echo "✅ Release APK signed — SHA256: $NEW_SHA"
        id: sign_apk

      # ── 10. Verify APK ─────────────────────────────────────────────────
      - name: Verify APK
        env:
          APK_PATH: ${{ steps.locate_apk.outputs.apk_path }}
          PKG: ${{ github.event.inputs.package_name }}
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          python3 builder/verify.py \
            --apk "$APK_PATH" \
            --expected-package "$PKG" \
            --build-type "$BUILD_TYPE"

      # ── 11. Upload APK as artifact ────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate_apk.outputs.apk_name }}
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 7

      # ── 12. Write build summary ───────────────────────────────────────
      - name: Build summary
        env:
          APK_NAME: ${{ steps.locate_apk.outputs.apk_name }}
          APK_SIZE: ${{ steps.sign_apk.outputs.apk_size || steps.locate_apk.outputs.apk_size }}
          APK_SHA: ${{ steps.sign_apk.outputs.apk_sha256 || steps.locate_apk.outputs.apk_sha256 }}
          APK_SIGNED: ${{ steps.sign_apk.outputs.apk_signed == 'true' && 'yes (release keystore)' || (github.event.inputs.build_type == 'debug' && 'yes (debug key)' || 'no — add KEYSTORE_* repo secrets to sign release builds') }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          PKG: ${{ github.event.inputs.package_name }}
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ APK Build Successful

          | Field | Value |
          |---|---|
          | App Name | $APP_NAME |
          | Package | $PKG |
          | Build Type | $BUILD_TYPE |
          | APK Name | $APK_NAME |
          | Size | $APK_SIZE |
          | SHA-256 | \`$APK_SHA\` |
          | Signed | $APK_SIGNED |

          **Download:** Go to Actions → this run → Artifacts section
          EOF
